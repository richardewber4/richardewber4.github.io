
name: Barcelona Security Check

on:
  workflow_dispatch:
  schedule:
    - cron: "20 1,4,7,10,13,16,19,22 * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm workflow is running
        run: |
          echo "Barcelona security scheduler is active."
          date -u
